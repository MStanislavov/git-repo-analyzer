<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- Git branch line -->
  <line x1="32" y1="16" x2="32" y2="64" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 36 Q44 36 52 28" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Branch nodes -->
  <circle cx="32" cy="16" r="5" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="32" cy="64" r="5" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="56" cy="24" r="5" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Magnifying glass over branch -->
  <circle cx="50" cy="52" r="12" stroke="#6366f1" stroke-width="2.5" fill="none" opacity="0.85"/>
  <line x1="59" y1="61" x2="67" y2="69" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Bar chart inside magnifier -->
  <rect x="44" y="52" width="3" height="8" rx="1" fill="#f59e0b" opacity="0.9"/>
  <rect x="49" y="48" width="3" height="12" rx="1" fill="#f59e0b" opacity="0.9"/>
  <rect x="54" y="50" width="3" height="10" rx="1" fill="#f59e0b" opacity="0.9"/>
  <!-- Text: Git Repo Analyzer -->
  <text x="82" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">
    <tspan>Git Repo</tspan>
    <tspan dx="8" fill="#f59e0b">Analyzer</tspan>
  </text>
  <!-- Tagline -->
  <text x="84" y="60" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
    Static Code Analysis Dashboard
  </text>
</svg>
