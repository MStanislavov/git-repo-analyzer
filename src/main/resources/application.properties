spring.config.import=optional:file:.env[.properties]

clone-target-directory=${CLONE_TARGET_DIR:D:/clone-dirs}

# Virtual threads
spring.threads.virtual.enabled=true

# Pipeline concurrency
pipeline.clone.max-concurrent=10
pipeline.sonar-analysis.max-concurrent=5
sonarqube-url=${SONARQUBE_URL}
sonarqube-scanner-url=${SONARQUBE_SCANNER_URL:${sonarqube-url}}
sonarqube-auth=${SONAR_TOKEN}
docker-network=${DOCKER_NETWORK:}

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:git_repo_analyzer}
spring.datasource.username=${APP_DB_USER:analyzer}
spring.datasource.password=${APP_DB_PASSWORD:analyzer}
spring.jpa.open-in-view=false

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
