services:
  sonarqube:
    image: sonarqube:10-community
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      sonar-db:
        condition: service_healthy

  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonarqube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonarqube}
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-db:
    image: postgres:16-alpine
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${APP_DB_USER:-analyzer}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-analyzer}
      POSTGRES_DB: ${APP_DB_NAME:-git_repo_analyzer}
    volumes:
      - app_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-analyzer}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
  app_postgresql_data:
